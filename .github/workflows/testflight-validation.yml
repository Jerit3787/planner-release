name: TestFlight Workflow Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the public release repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate workflow YAML syntax
        run: |
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path, aliases: true) }' .github/workflows/testflight.yml .github/workflows/testflight-validation.yml

      - name: Run TestFlight validation tests
        run: node --test tests/testflight/*.test.mjs
